[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

build_flags =
    -D CORE_DEBUG_LEVEL=0
    -O2

; I2C lock for this board is GPIO 8/9 (see config.h).
; Classic ESP32 DevKit used 21/22 — do not copy those onto an S3.

lib_deps =
    Wire
